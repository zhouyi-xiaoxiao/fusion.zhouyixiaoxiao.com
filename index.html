<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#06070c" />
    <link rel="icon" href="data:," />
    <title>Pixel-perfect was not enough · Xiaoxiao Zhouyi · FusionEC-26</title>
    <meta name="description" content="An interactive talk: score-aware flux-map regression on DIII-D, a physics inverse for MAST, and how one student worked with AI agents. NeurIPS 2026 Fusion Equilibrium Challenge, 2nd in Challenge 1." />
    <script>
      let mode = 'dark';
      try { const q = new URLSearchParams(location.search); if (q.has('bright')) mode = q.get('bright') === '0' ? 'dark' : 'bright'; else if (q.has('room')) mode = q.get('room') === 'bright' ? 'bright' : 'dark'; else { const s = localStorage.getItem('fusion-talk-mode'); if (s === 'bright' || s === 'dark') mode = s; } } catch {}
      document.documentElement.dataset.mode = mode;
    </script>
    <link rel="stylesheet" href="./app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #06070c; color: #f3f1ea; }
      html[data-mode="bright"], html[data-mode="bright"] body { background: #fbfaf6; color: #0b0c12; }
      #m-hint { display: none; }
      @media (orientation: portrait) and (max-width: 700px) {
        #m-hint { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; gap: 14px; align-items: flex-start;
          padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: rgba(12, 14, 22, 0.96);
          border-top: 1px solid rgba(243, 241, 234, 0.2); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f3f1ea; }
        #m-hint b { font-weight: 600; }
        #m-hint button { flex: none; width: 32px; height: 32px; margin: -4px -6px 0 0; border: 0; background: none; color: #d2cfc6; font: 22px/1 system-ui; cursor: pointer; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="m-hint" role="note">
      <span><b>Built for a wide screen.</b> Turn your phone sideways for the full view, then swipe left on the text to move through the talk. A phone version is on its way.</span>
      <button type="button" aria-label="Dismiss" onclick="this.parentNode.remove()">&times;</button>
    </div>
    <noscript>
      <p style="font: 18px/1.5 system-ui; max-width: 40em; margin: 4em auto; padding: 0 1em">
        This talk is an interactive page and needs JavaScript. The method is described in the report linked from
        github.com/zhouyi-xiaoxiao/fusion-equilibrium-challenge-2026.
      </p>
    </noscript>
    <script type="module" src="./app.js"></script>
    <script>
      // opened as a file (double-click from a USB stick): the browser blocks the module script and the page would
      // stay black. After 3 s with nothing drawn, say how to open it.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.firstChild) return;
        var file = location.protocol === 'file:';
        app.innerHTML =
          '<p style="font: 500 24px/1.5 system-ui, sans-serif; max-width: 34em; margin: 4em auto; padding: 0 1em">' +
          (file
            ? 'This talk has to be opened through a local web server. In this folder run <code>python3 -m http.server</code>, then open <code>http://localhost:8000</code>.'
            : 'The talk has not started. Reload the page; if it stays empty, open it through a local web server (<code>python3 -m http.server</code> in this folder).') +
          '</p>';
      }, 3000);
    </script>
  </body>
</html>
